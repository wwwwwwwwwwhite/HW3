name: BuildMyPC CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q

  publish:
    name: Build and publish multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/buildmypc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/buildmypc:${{ github.sha }}

  deploy:
    name: Deploy on Mac self-hosted runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Pull and update service
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d --force-recreate
      - name: Verify container and HTTP health
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q buildmypc)"
          if [ -z "$container_id" ]; then
            echo "Deployment failed: Compose did not create the buildmypc container." >&2
            exit 1
          fi
          deadline=$((SECONDS + 90))
          while true; do
            container_state="$(docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container_id")"
            if [ "$container_state" = "running healthy" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Deployment failed: container did not become healthy (state: $container_state)." >&2
              docker inspect "$container_id"
              exit 1
            fi
            sleep 3
          done
          python3 - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          deadline = time.monotonic() + 90
          last_error = "health endpoint did not become ready"
          while time.monotonic() < deadline:
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=3) as response:
                      if response.status == 200:
                          print(f"HTTP health check passed: {response.read().decode()}")
                          break
                      last_error = f"unexpected HTTP status: {response.status}"
              except (OSError, URLError) as error:
                  last_error = str(error)
              time.sleep(3)
          else:
              raise SystemExit(f"Deployment health check failed: {last_error}")
          PY
          docker compose ps --status running
